services:
  web-server:
    build:
      context: .
      dockerfile: ./web-server.Dockerfile
    ports:
      - 80
    depends_on:
      - fast-cgi
    restart: always
    labels:
      - webproxy.path=
  fast-cgi:
    build:
      context: .
      dockerfile: ./fast-cgi.Dockerfile
    expose:
      - 9000
    volumes:
      - ${SITEMAP_PATH:-./sitemap.json}:/var/www/html/sitemap.json:ro
    environment:
      AUTH_URL: ${AUTH_URL:-}
    restart: always
